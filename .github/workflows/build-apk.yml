name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org dz.gs --project-name gs_point_scanner .
      - run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: mkdir -p ~/.gradle/init.d && cp tools/force-sdk.gradle ~/.gradle/init.d/force-sdk.gradle
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: GS_Point_Scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk GS_Point_Scanner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GS_Point_Scanner.apk --title "GS Point Scanner (آخر نسخة)" --notes "حمّل GS_Point_Scanner.apk وثبّته على هاتف أندرويد."
